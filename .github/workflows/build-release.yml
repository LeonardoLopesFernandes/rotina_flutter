name: Build Release APK (arm64-v8a)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "JKS file size: $(wc -c < android/app/upload-keystore.jks)"
          # Converter JKS para PKCS12 (compatível com Java 17)
          keytool -importkeystore \
            -srckeystore android/app/upload-keystore.jks \
            -destkeystore android/app/upload-keystore.p12 \
            -deststoretype PKCS12 \
            -storepass minhaloja123 \
            -keypass minhaloja123 \
            -srcstorepass minhaloja123 \
            -srcalias upload \
            -destalias upload \
            -noprompt
          echo "storePassword=minhaloja123" > android/key.properties
          echo "keyPassword=minhaloja123" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.p12" >> android/key.properties

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split-per-abi arm64-v8a, release)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk rotina-arm64-v8a-release.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Rotina Comercial (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            Build automático a partir do commit `${{ github.sha }}`.
            APK **arm64-v8a** (release), otimizado e menor.
            Instale sobre a versão anterior para atualizar (versionCode crescente).
          files: rotina-arm64-v8a-release.apk
          overwrite: true
          make_latest: true